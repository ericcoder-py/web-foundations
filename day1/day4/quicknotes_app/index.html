<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Your simple & efficient note-taking companion</p>
    </header>

    <main>
        <!-- Task 1: Section 1 - Add a note -->
        <section id="add-note-section">
            <h2>Add a Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note Content:</label>
                    <input type="text" id="note-input" placeholder="Type your note here...">
                </div>

                <div class="form-group">
                    <label for="note-category">Category:</label>
                    <select id="note-category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit" id="add-btn">Add Note</button>
            </form>
            <p id="error-message"></p>
        </section>

        <!-- Task 1: Section 2 - Your notes -->
        <section id="your-notes-section">
            <h2>Your Notes</h2>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search notes...">
                <!-- Bonus (+5 points): Clear all button -->
                <button id="clear-all-btn">Clear All</button>
            </div>

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; QuickNotes App. All rights reserved.</p>
    </footer>

</body>
</html>
